<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        #game-info {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin-bottom: 10px;
        }
        
        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 1px;
            background-color: #999;
            padding: 1px;
            border: 2px solid #333;
        }
        
        .block {
            width: 30px;
            height: 30px;
            background-color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .block:hover {
            opacity: 0.8;
        }
        
        .color-1 { background-color: #FF5252; }
        .color-2 { background-color: #FFD740; }
        .color-3 { background-color: #69F0AE; }
        .color-4 { background-color: #40C4FF; }
        .color-5 { background-color: #E040FB; }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
        
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Frengky block</h1>
    <div id="game-info">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
    </div>
    <div id="game-board"></div>
    <div id="game-over">
        <h2>Game Over!</h2>
        <p>Your final score: <span id="final-score">0</span></p>
        <button id="restart-btn">Play Again</button>
    </div>

    <script>
        // Game variables
        const ROWS = 15;
        const COLS = 10;
        const COLORS = ['color-1', 'color-2', 'color-3', 'color-4', 'color-5'];
        let board = [];
        let score = 0;
        let level = 1;
        let gameActive = true;
        
        // DOM elements
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const gameOverDisplay = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Initialize the game
        function initGame() {
            board = [];
            score = 0;
            level = 1;
            gameActive = true;
            
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            gameOverDisplay.style.display = 'none';
            
            // Create the game board
            gameBoard.innerHTML = '';
            
            for (let row = 0; row < ROWS; row++) {
                board[row] = [];
                for (let col = 0; col < COLS; col++) {
                    const colorIndex = Math.floor(Math.random() * COLORS.length);
                    board[row][col] = colorIndex + 1; // 1-5 for colors
                    
                    const block = document.createElement('div');
                    block.className = `block ${COLORS[colorIndex]}`;
                    block.dataset.row = row;
                    block.dataset.col = col;
                    block.addEventListener('click', () => handleBlockClick(row, col));
                    
                    gameBoard.appendChild(block);
                }
            }
        }
        
        // Handle block clicks
        function handleBlockClick(row, col) {
            if (!gameActive) return;
            
            const color = board[row][col];
            if (color === 0) return; // Already cleared
            
            const blocksToClear = findConnectedBlocks(row, col, color);
            
            if (blocksToClear.length >= 2) {
                clearBlocks(blocksToClear);
                updateScore(blocksToClear.length);
                collapseBlocks();
                checkGameOver();
            }
        }
        
        // Find connected blocks of the same color
        function findConnectedBlocks(row, col, color, visited = new Set()) {
            const key = `${row},${col}`;
            if (
                row < 0 || row >= ROWS || 
                col < 0 || col >= COLS || 
                board[row][col] !== color || 
                visited.has(key)
            ) {
                return [];
            }
            
            visited.add(key);
            let result = [[row, col]];
            
            // Check adjacent blocks
            result = result.concat(findConnectedBlocks(row + 1, col, color, visited));
            result = result.concat(findConnectedBlocks(row - 1, col, color, visited));
            result = result.concat(findConnectedBlocks(row, col + 1, color, visited));
            result = result.concat(findConnectedBlocks(row, col - 1, color, visited));
            
            return result;
        }
        
        // Clear blocks from the board
        function clearBlocks(blocks) {
            blocks.forEach(([row, col]) => {
                board[row][col] = 0;
                const blockElement = document.querySelector(`.block[data-row="${row}"][data-col="${col}"]`);
                blockElement.style.backgroundColor = 'transparent';
                blockElement.style.border = 'none';
                blockElement.style.pointerEvents = 'none';
            });
        }
        
        // Collapse blocks after clearing
        function collapseBlocks() {
            for (let col = 0; col < COLS; col++) {
                let emptyRow = ROWS - 1;
                
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (board[row][col] !== 0) {
                        if (row !== emptyRow) {
                            // Move block down
                            board[emptyRow][col] = board[row][col];
                            board[row][col] = 0;
                            
                            // Update DOM
                            const blockElement = document.querySelector(`.block[data-row="${row}"][data-col="${col}"]`);
                            const newBlockElement = document.querySelector(`.block[data-row="${emptyRow}"][data-col="${col}"]`);
                            
                            newBlockElement.className = blockElement.className;
                            newBlockElement.style.backgroundColor = blockElement.style.backgroundColor;
                            newBlockElement.style.border = blockElement.style.border;
                            newBlockElement.style.pointerEvents = 'auto';
                            
                            blockElement.className = 'block';
                            blockElement.style.backgroundColor = 'transparent';
                            blockElement.style.border = 'none';
                            blockElement.style.pointerEvents = 'none';
                        }
                        emptyRow--;
                    }
                }
            }
        }
        
        // Update score
        function updateScore(blocksCleared) {
            const points = blocksCleared * blocksCleared * level;
            score += points;
            scoreDisplay.textContent = score;
            
            // Level up every 1000 points
            const newLevel = Math.floor(score / 1000) + 1;
            if (newLevel > level) {
                level = newLevel;
                levelDisplay.textContent = level;
            }
        }
        
        // Check if game is over
        function checkGameOver() {
            let hasMoves = false;
            
            for (let row = 0; row < ROWS && !hasMoves; row++) {
                for (let col = 0; col < COLS && !hasMoves; col++) {
                    if (board[row][col] !== 0) {
                        const color = board[row][col];
                        const connected = findConnectedBlocks(row, col, color);
                        if (connected.length >= 2) {
                            hasMoves = true;
                        }
                    }
                }
            }
            
            if (!hasMoves) {
                gameActive = false;
                finalScoreDisplay.textContent = score;
                gameOverDisplay.style.display = 'block';
            }
        }
        
        // Event listeners
        restartBtn.addEventListener('click', initGame);
        
        // Start the game
        initGame();
    </script>
</body>
</html>
